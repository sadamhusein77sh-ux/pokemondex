<div class="flex flex-col gap-1.5" data-testid="pokemon-stats">
  @for (entry of bars(); track trackByName($index, entry)) {
    <div
      class="grid grid-cols-[60px_28px_1fr] items-center gap-2 text-xs"
      [attr.data-stat]="entry.name"
    >
      <span
        class="text-right text-[10px] font-medium uppercase tracking-wider text-gray-500"
        data-testid="pokemon-stats-label"
      >
        {{ entry.label }}
      </span>
      <span
        class="text-right text-[11px] font-semibold tabular-nums text-gray-700"
        data-testid="pokemon-stats-value"
      >
        {{ entry.value }}
      </span>
      <div class="relative h-1.5 overflow-hidden rounded-full bg-gray-100">
        <div
          class="absolute inset-y-0 left-0 rounded-full bg-blue-500"
          [style.width]="entry.width"
          data-testid="pokemon-stats-bar"
        ></div>
      </div>
    </div>
  }
  <div class="mt-1 grid grid-cols-[60px_28px_1fr] items-center gap-2 border-t border-gray-100 pt-2 text-xs">
    <span
      class="col-span-2 text-right text-[10px] font-semibold uppercase tracking-wider text-gray-500"
    >
      Total
    </span>
    <span class="text-left text-xs font-bold tabular-nums text-gray-800">{{ total() }}</span>
  </div>
</div>
