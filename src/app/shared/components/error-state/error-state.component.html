<div
  class="flex flex-col items-center justify-center gap-4 px-6 py-16 text-center"
  data-testid="error-state"
  role="alert"
>
  <div
    class="flex h-24 w-24 items-center justify-center rounded-full bg-red-50"
    aria-hidden="true"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      class="h-12 w-12 text-red-500"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
  </div>
  <div class="space-y-1">
    <h2 class="text-lg font-semibold text-gray-800">{{ title() }}</h2>
    <p class="max-w-xs text-sm text-gray-500">{{ message() }}</p>
  </div>
  <button
    type="button"
    class="mt-1 rounded-full bg-red-600 px-5 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-400"
    (click)="onRetry()"
    data-testid="error-state-retry"
  >
    {{ retryLabel() }}
  </button>
</div>
