<div
  class="grid grid-cols-2 gap-4 p-3 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5"
  data-testid="pokemon-skeleton-grid"
>
  @for (_ of placeholderArray(); track $index) {
    <div
      class="animate-pulse overflow-hidden rounded-xl bg-white shadow-md ring-1 ring-black/5"
      data-testid="pokemon-skeleton-card"
    >
      <div class="aspect-square w-full bg-gradient-to-br from-gray-100 to-gray-200"></div>
      <div class="flex flex-col gap-1.5 px-1.5 py-1.5">
        <div class="h-2 w-3/4 rounded bg-gray-200"></div>
        <div class="h-1.5 w-1/2 rounded-full bg-gray-200"></div>
      </div>
    </div>
  }
</div>
