<div
  class="flex flex-col items-center justify-center gap-4 px-6 py-16 text-center"
  data-testid="empty-state"
>
  <div class="relative" aria-hidden="true">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 100 100"
      class="h-24 w-24"
      fill="none"
    >
      <circle
        cx="50"
        cy="50"
        r="44"
        fill="#ffffff"
        stroke="#1f2937"
        stroke-width="4"
      ></circle>
      <path
        d="M50 6 A44 44 0 0 1 50 94"
        fill="#ef4444"
        stroke="#1f2937"
        stroke-width="4"
      ></path>
      <rect
        x="6"
        y="46"
        width="88"
        height="8"
        fill="#1f2937"
      ></rect>
      <circle
        cx="50"
        cy="50"
        r="12"
        fill="#ffffff"
        stroke="#1f2937"
        stroke-width="4"
      ></circle>
      <circle
        cx="50"
        cy="50"
        r="6"
        fill="#d1d5db"
      ></circle>
    </svg>
  </div>
  <div class="space-y-1">
    <h2 class="text-lg font-semibold text-gray-800">{{ title() }}</h2>
    @if (message()) {
      <p class="max-w-xs text-sm text-gray-500">{{ message() }}</p>
    }
  </div>
  @if (actionLabel()) {
    <button
      type="button"
      class="mt-1 rounded-full bg-blue-600 px-5 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-400"
      (click)="onAction()"
      data-testid="empty-state-action"
    >
      {{ actionLabel() }}
    </button>
  }
</div>
