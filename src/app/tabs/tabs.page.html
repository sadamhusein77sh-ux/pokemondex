<ion-tabs>

  <ion-tab-bar slot="bottom" class="border-t border-gray-100">
    <ion-tab-button tab="browse" href="/tabs/browse">
      <ion-icon aria-hidden="true" name="grid-outline"></ion-icon>
      <ion-label>Browse</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="favorites" href="/tabs/favorites">
      <ion-icon aria-hidden="true" name="heart"></ion-icon>
      <ion-label>Favorites</ion-label>
      @if (favoritesCount() > 0) {
        <ion-badge
          class="tab-badge tab-badge--favorites"
          data-testid="tabs-favorites-count"
        >
          {{ favoritesCount() }}
        </ion-badge>
      }
    </ion-tab-button>

    <ion-tab-button tab="team" href="/tabs/team">
      <ion-icon aria-hidden="true" name="people-circle-outline"></ion-icon>
      <ion-label>Team</ion-label>
      @if (teamCount() > 0) {
        <ion-badge
          class="tab-badge tab-badge--team"
          data-testid="tabs-team-count"
        >
          {{ teamCount() }}
        </ion-badge>
      }
    </ion-tab-button>

    <ion-tab-button tab="about" href="/tabs/about">
      <ion-icon aria-hidden="true" name="information-circle-outline"></ion-icon>
      <ion-label>About</ion-label>
    </ion-tab-button>
  </ion-tab-bar>

</ion-tabs>
